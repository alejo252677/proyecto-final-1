<!DOCTYPE html>
<html lang="es">Ii

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>valorant - pokedex</title>

    <link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

        <div class="logo">

            <img
                src="https://www.bing.com/th/id/OIP.beLc4wCZZWBZs11o0-QqDwHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2"
                alt="valorant logo">

            <div>

                <h1>valorant - pokedex</h1>

                <p>Proyecto con HTML, CSS y JavaScript</p>

            </div>

        </div>

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar arma ...">

            <button id="searchButton">

                Buscar

            </button>

        </div>

    </header>

    
    <main>



       
        <!-- LISTA -->

        <section class="arms-list">

            <div class="section-title">

                <h2>Armas</h2>

                <span id="armCounter">

                    0 Armas

                </span>

            </div>

            <div id="Container">
                <!-- JavaScript -->

            </div>

            <div class="pagination">

                <button id="previousBtn">

                    ⬅️ Anterior

                </button>

                <button id="nextBtn">

                    Siguiente ➜

                </button>

            </div>

        </section>

        <!-- ========================= -->
        <!-- DETALLE -->
        <!-- ========================= -->

        <aside class="search-detail">

            <div id="detailContainer">

                <img
                    src="https://cdna.artstation.com/p/assets/images/images/025/645/082/large/vladyslav-liedienov-first-terrorist5.jpg?1586457106"
                    alt="valorant logo">

                <h2>

                    valorant

                </h2>

                <p>

                    Selecciona un arma para ver sus estadisticas

                </p>

            </div>

        </aside>

    </main>

    <!-- ========================= -->
    <!-- LOADING -->
    <!-- ========================= -->

    <div id="loading" class="hidden">

        <div class="loader"></div>

        <p>

            Cargando armas...

        </p>

    </div>

    <!-- ========================= -->
    <!-- ERROR -->
    <!-- ========================= -->

    <div id="errorMessage"
         class="hidden">

        Arma no encontrada.

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer>

        <p>

             Pokedex valorant - utilizando fetch API
        </p>

        <p>

            HTML • CSS • JavaScript • Fetch API

        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
